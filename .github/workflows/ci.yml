name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API (typecheck, unit and end-to-end tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: qilo
          POSTGRES_PASSWORD: qilo
          POSTGRES_DB: qilo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U qilo" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://qilo:qilo@127.0.0.1:5432/qilo_test
      TEST_REDIS_URL: redis://127.0.0.1:6379/1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Migrations are in sync with the schema
        run: |
          npx drizzle-kit generate --name ci-check
          git diff --exit-code -- drizzle || (echo "Run npm run db:generate and commit the migration" && exit 1)
          test -z "$(git status --porcelain -- drizzle)"
      - run: npm test

  mobile:
    name: Flutter (analyze and test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # Pinned to the version the app was built and verified with. Flutter
          # 3.50 deprecates package:flutter/material.dart in favour of
          # material_ui; migrate during the UI rebuild, then bump this.
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
